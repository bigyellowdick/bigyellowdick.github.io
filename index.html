document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-selected',String(b===button))});grid.setAttribute('aria-labelledby',button.id);render()}));
grid.addEventListener('click',e=>{const card=e.target.closest('[data-product]');if(card)productDetail(Number(card.dataset.product));if(e.target.closest('#reset-products')){search.value='';document.getElementById('tab-gpt').click()}});
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.action==='orders')openModal('<h2 id="modal-title">订单查询</h2><p>输入订单号，查询订单进度。</p><form id="order-form"><label for="order-number">订单号</label><input id="order-number" placeholder="请输入订单号" required><button type="submit" class="primary submit">查询订单</button></form><p class="hint">演示页面，暂未接入订单服务。</p>');else auth(b.dataset.action)}));
document.getElementById('tutorial').addEventListener('click',()=>openModal('<h2 id="modal-title">USDT充值教程</h2><p>充值服务暂未开放。</p><p>此处预留充值教程入口。接入正式服务后，可在这里展示支持的网络、充值步骤及到账说明。</p><button class="primary submit" id="understood">我知道了</button>'));
content.addEventListener('click',e=>{if(e.target.id==='minus'||e.target.id==='plus'){quantity=Math.max(1,Math.min(currentProduct.stock,quantity+(e.target.id==='plus'?1:-1)));document.getElementById('quantity').textContent=quantity;document.getElementById('total').textContent=Number((quantity*currentProduct.price).toFixed(2));document.getElementById('minus').disabled=quantity===1;document.getElementById('plus').disabled=quantity===currentProduct.stock}if(e.target.id==='buy')toast('演示页面，暂未接入支付服务');if(e.target.id==='understood')closeModal()});
content.addEventListener('submit',e=>{e.preventDefault();toast(e.target.id==='order-form'?'订单服务暂未开放':'账号服务暂未开放');if(e.target.id==='auth-form')e.target.reset()});
document.getElementById('close-modal').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.getElementById('theme').addEventListener('click',()=>document.body.classList.toggle('dark'));document.getElementById('language').addEventListener('click',()=>toast('当前语言：简体中文'));document.getElementById('shop-button').addEventListener('click',()=>{search.value='';document.getElementById('tab-gpt').click();document.getElementById('store').scrollIntoView({behavior:'smooth',block:'start'})});render();
</script>
</body>
</html>
